name: Collect game versions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: collect-game-versions
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Collect
        run: |
          set -o pipefail
          python src/main.py 2>&1 | tee collect.log
      - name: Annotate collector failure
        if: failure()
        run: |
          [ -f collect.log ] || exit 0
          grep '^FAILED:' collect.log | while IFS= read -r line; do
            echo "::error::${line#FAILED: }"
          done
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh game data"
          git push
