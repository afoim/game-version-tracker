name: Validate game version tracker

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "data/games.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "data/games.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Collect all games
        run: python src/main.py
      - name: Ensure generated data is committed
        run: git diff --exit-code -- data/games.json
