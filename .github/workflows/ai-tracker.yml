name: AI Game Version Tracker

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the full agent pipeline without writing or committing data
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: game-version-tracker-ai
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGENT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      AGENT_MODEL: deepseek-v4-flash-260713
      AGENT_PROVIDER_ID: acofork
      AGENT_PROVIDER_NPM: '@ai-sdk/openai-compatible'
      AGENT_PROVIDER_NAME: AcoFork LLM
      AGENT_LLM_BASE_URL: https://api-llm.acofork.com/v1
      AGENT_LLM_API_KEY: ${{ secrets.AF_LLM_API_KEY }}
      AGENT_LLM_TIMEOUT_MS: '300000'
      AGENT_LLM_ATTEMPTS: '3'
      AGENT_SESSION_ID: game-version-tracker-${{ github.run_id }}
      BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}

      - name: Install Node dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium system dependencies
        run: npx playwright install --with-deps chromium

      - name: Validate current dataset
        run: npm run validate

      - name: Require LLM credentials
        shell: bash
        run: |
          if [[ -z "${AGENT_LLM_API_KEY:-}" ]]; then
            echo "::error::缺少 AGENT_LLM_API_KEY（GitHub Secret AF_LLM_API_KEY），无法调用 AI provider，版本数据将无法更新。"
            exit 1
          fi

      - name: Run AI tracker
        shell: bash
        run: |
          if [[ "$AGENT_DRY_RUN" == "true" ]]; then
            npm run agent:dry
          else
            npm run agent
          fi

      - name: Validate resulting dataset
        run: npm run validate

      - name: Detect approved data changes
        id: changes
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all -- data)"
          unexpected=""
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            file="${line:3}"
            case "$file" in
              data/games.json|data/media-feed.json|data/media/*) ;;
              *) unexpected+="$file"$'\n' ;;
            esac
          done <<< "$status"

          if [[ -n "$unexpected" ]]; then
            echo "Unexpected data changes produced by the agent:"
            printf '%s' "$unexpected"
            exit 1
          fi

          if [[ -n "$status" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push approved data
        if: steps.changes.outputs.changed == 'true' && env.AGENT_DRY_RUN != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json
          if [[ -f data/media-feed.json ]]; then git add data/media-feed.json; fi
          if [[ -d data/media ]]; then git add data/media; fi
          git commit -m "data: update game versions and media feed"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master

      - name: Guard against silent version staleness
        if: always() && env.AGENT_DRY_RUN != 'true'
        shell: bash
        run: |
          if [[ ! -f agent-output/report.json ]]; then
            echo "::error::缺少 agent-output/report.json，无法确认本轮版本数据是否已更新。"
            exit 1
          fi
          media_only="$(node -e "const r=require('./agent-output/report.json');process.stdout.write(String(Boolean(r.media_only_fallback)))")"
          if [[ "$media_only" == "true" ]]; then
            echo "::error::本轮 AI provider 不可用，已自动降级为 media-only，games.json 版本事实未更新。请检查 AGENT_LLM_* 配置与 AF_LLM_API_KEY。"
            exit 1
          fi

      - name: Upload AI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-tracker-report-${{ github.run_id }}
          path: agent-output/
          if-no-files-found: warn
          retention-days: 14
