name: AI Game Version Tracker

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the full agent pipeline without writing or committing data
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: game-version-tracker-ai
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGENT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      AGENT_MODEL: muse-spark-1.3-contributor-free
      AGENT_SESSION_ID: game-version-tracker-${{ github.run_id }}
      OPENCODE_ZEN_BASE_URL: https://opencode.ai/zen/v1
      OPENCODE_API_KEY: public
      BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}

      - name: Install Node dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium system dependencies
        run: npx playwright install --with-deps chromium

      - name: Validate current dataset
        run: npm run validate

      - name: Run AI tracker
        shell: bash
        run: |
          if [[ "$AGENT_DRY_RUN" == "true" ]]; then
            npm run agent:dry
          else
            npm run agent
          fi

      - name: Validate resulting dataset
        run: npm run validate

      - name: Detect approved data changes
        id: changes
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all -- data)"
          unexpected=""
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            file="${line:3}"
            case "$file" in
              data/games.json|data/media-feed.json|data/media/*) ;;
              *) unexpected+="$file"$'\n' ;;
            esac
          done <<< "$status"

          if [[ -n "$unexpected" ]]; then
            echo "Unexpected data changes produced by the agent:"
            printf '%s' "$unexpected"
            exit 1
          fi

          if [[ -n "$status" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push approved data
        if: steps.changes.outputs.changed == 'true' && env.AGENT_DRY_RUN != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json
          if [[ -f data/media-feed.json ]]; then git add data/media-feed.json; fi
          if [[ -d data/media ]]; then git add data/media; fi
          git commit -m "data: update game versions and media feed"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master

      - name: Upload AI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-tracker-report-${{ github.run_id }}
          path: agent-output/
          if-no-files-found: warn
          retention-days: 14
